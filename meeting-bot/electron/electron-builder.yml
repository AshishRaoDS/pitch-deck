appId: com.meetingbot.app
productName: Meeting Bot
extraResources:
  - from: "../backend/dist/meeting-bot-server"
    to: "backend/meeting-bot-server"
    filter:
      - "**/*"
  - from: "../frontend/dist"
    to: "frontend/dist"
    filter:
      - "**/*"
files:
  - "dist/main.js"
  - "dist/preload.js"
  - package.json
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: assets/icon.icns
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: "Meeting Bot needs microphone access to transcribe your meetings."
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
